
config:
  target: "https://jsonplaceholder.typicode.com"
  phases:
    - duration: 30
      arrivalRate: 1

      
  payload:
    path: "load.csv"
    fields:
      - "title"
      - "body"
      - "userId"
    order: sequence
   

  plugins:
    ensure:
      thresholds:
        - "http.response_time.p95": 1000
        - "http.response_time.p99": 1500
        - "http.response_time.mean": 800

          conditions:
        - expression: "vusers.failed == 0"
        - expression: "http.response_time.max < 1000 and http.response_time.2xx.p99 < 1500"

scenarios:
  - name: "Posts API Test"
    flow:
      - get:
          url: "/posts/1"
          expect:
            - statusCode: 200

      - post:
          url: "/posts"
          headers:
            Content-Type: "application/json"
          json:
            title: "{{ title }}"
            body: "{{ body }}"
            userId: "{{ userId }}"
          expect:
            - statusCode: 201
